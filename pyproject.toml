[project]
name = "lapse"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy", "pandas", "scikit-learn"]

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff", "pre-commit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lapse"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"